<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b3d27">
<title>SIPN – Sistem Informasi Pagar Nusa (Prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
--g950:#062a1b;--g900:#0b3d27;--g800:#0e4d32;--g700:#126440;--g600:#178050;--g500:#1f9a62;--g100:#e3f3ea;--g50:#f1f8f4;
--gold:#c99a1e;--gold600:#9a7510;--gold100:#fbf1d3;
--bg:#f3f5f4;--card:#fff;--text:#14211a;--muted:#62726a;--line:#e2e8e4;
--red:#c43d32;--red100:#fdeceb;--blue:#2563eb;--blue100:#e7effe;--gray100:#eef1ef;
--shadow:0 1px 2px rgba(10,40,25,.05),0 4px 16px rgba(10,40,25,.06);--r:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{letter-spacing:-.2px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
/* sidebar */
.side{background:linear-gradient(180deg,var(--g900),var(--g950));color:#dfeee6;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px}
.brand{display:flex;gap:11px;align-items:center;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:14px}
.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--gold),#e8c25a);display:grid;place-items:center;color:var(--g950);flex:none}
.logo.sm{width:32px;height:32px;border-radius:9px}
.brand b{display:block;color:#fff;font-size:15px}
.brand small{color:#a9c9b8;font-size:12px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav .grp{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#7fa792;padding:10px 12px 4px;font-weight:600}
.nav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:#cfe3d8;padding:10px 12px;border-radius:10px;cursor:pointer;text-align:left;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:rgba(201,154,30,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav button.on svg{color:var(--gold)}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:12px;font-size:12px;color:#a9c9b8}
.who{display:flex;gap:10px;align-items:center;margin-top:8px}
.who b{color:#fff;display:block;font-size:13px}
.av{width:36px;height:36px;border-radius:50%;background:var(--g100);color:var(--g700);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.side .av{background:rgba(255,255,255,.12);color:#fff}
.av.lg{width:58px;height:58px;font-size:20px}
.av.xl{width:64px;height:64px;font-size:22px;background:rgba(255,255,255,.15);color:#fff;border:2px solid var(--gold)}
/* main */
main{min-width:0;padding:22px 28px 40px}
.mtop{display:none}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:23px;margin:0}
.top .sub{color:var(--muted);font-size:13px}
.ctl{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.sel{display:flex;flex-direction:column;gap:3px}
.sel label{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
select,input,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;outline:none;min-width:0}
select:focus,input:focus,textarea:focus{border-color:var(--g500);box-shadow:0 0 0 3px var(--g100)}
/* cards & grid */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;min-width:0}
.card h3{margin:0;font-size:15px}
.hint{color:var(--muted);font-size:12.5px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px}
.kpi-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.kl{color:var(--muted);font-weight:600;font-size:13px}
.kt{width:38px;height:38px;border-radius:11px;display:grid;place-items:center}
.t-g{background:var(--g100);color:var(--g700)}.t-gold{background:var(--gold100);color:var(--gold600)}.t-b{background:var(--blue100);color:var(--blue)}.t-r{background:var(--red100);color:var(--red)}
.kv{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
.ks{color:var(--muted);font-size:12.5px;margin-top:3px}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.g2e{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;height:auto;display:block}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.bl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.bt{height:10px;background:var(--gray100);border-radius:99px;overflow:hidden}
.bf{height:100%;background:linear-gradient(90deg,var(--g600),var(--g500));border-radius:99px}
.bar-row b{text-align:right}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.mini-list{display:flex;flex-direction:column;gap:9px;flex:1;min-width:160px}
.mini-list div{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.mini-list span{color:var(--muted)}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.lg-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px}
.lg-grid i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;border:1px solid rgba(0,0,0,.08)}
/* table */
.tbl-wrap{overflow-x:auto;border-radius:12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{background:var(--g800);color:#fff;text-align:left;font-weight:600;padding:10px 12px;white-space:nowrap;font-size:12.5px}
.tbl th:first-child{border-top-left-radius:10px}.tbl th:last-child{border-top-right-radius:10px}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--g50)}
.tbl .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr.total td{font-weight:800;background:var(--g50);border-top:2px solid var(--g700);border-bottom:0}
.namecell{display:flex;gap:10px;align-items:center}
.namecell .av{width:32px;height:32px;font-size:12px}
.namecell small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.p-green{background:var(--g100);color:var(--g700)}.p-gold{background:var(--gold100);color:var(--gold600)}.p-red{background:var(--red100);color:var(--red)}.p-blue{background:var(--blue100);color:var(--blue)}.p-gray{background:var(--gray100);color:var(--muted)}
.belt{display:inline-flex;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid rgba(0,0,0,.06)}
.in{color:var(--g700);font-weight:600}.out{color:var(--red);font-weight:600}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--g700);color:#fff;white-space:nowrap}
.btn:hover{background:var(--g800)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--g50)}
.btn.gold{background:var(--gold);color:var(--g950)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.link{background:none;border:0;color:var(--g700);font-weight:600;cursor:pointer;padding:0}
.tabs{display:flex;gap:4px;background:#e6ebe8;padding:4px;border-radius:12px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:16px}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:#fff;color:var(--g800);box-shadow:var(--shadow)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{position:relative;flex:1;min-width:200px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;padding-left:36px}
/* agenda */
.agenda{display:flex;flex-direction:column;gap:10px}
.ag{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;border:1px solid var(--line)}
.ag-d{width:50px;flex:none;text-align:center;border-radius:10px;background:var(--g800);color:#fff;padding:6px 0;line-height:1.1}
.ag-d b{display:block;font-size:18px}.ag-d small{font-size:11px;color:var(--gold100);text-transform:uppercase}
.ag-t{flex:1;min-width:0}.ag-t b{display:block;font-size:13.5px}
/* struktur */
.levels{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lv{padding:7px 13px;border-radius:99px;border:1.5px dashed #c9d3cd;color:var(--muted);font-weight:600;font-size:12.5px;background:#fff}
.lv.on{background:var(--g700);color:#fff;border:1.5px solid var(--g700)}
.lv.next{border-color:var(--gold);color:var(--gold600)}
.arrow{color:#b5c2bb}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.person{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px}
.person small{display:block;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.person b{font-size:13.5px}
.person.lead{background:linear-gradient(135deg,var(--g800),var(--g700));border:0;color:#fff}
.person.lead small{color:var(--gold100)}.person.lead .av{background:var(--gold);color:var(--g950)}
details.pac{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
details.pac summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
details.pac summary::-webkit-details-marker{display:none}
details.pac[open] summary{background:var(--g50);border-bottom:1px solid var(--line)}
.pac-ic{width:36px;height:36px;border-radius:10px;background:var(--gold100);color:var(--gold600);display:grid;place-items:center;flex:none}
.pac-t{flex:1;min-width:140px}.pac-t b{display:block}
.pac-n{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.pac-n b{color:var(--text);font-size:14px;display:block}
details.pac .tbl-wrap{border-radius:0}
details.pac .tbl th{background:var(--g100);color:var(--g800);border-radius:0!important}
/* program */
.prog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.prog{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff;display:flex;flex-direction:column;gap:10px}
.prog h4{margin:0;font-size:14.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.meta span{display:inline-flex;gap:5px;align-items:center}
.progress{height:8px;background:var(--gray100);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--g600);border-radius:99px}
.progress.gold i{background:var(--gold)}
.money{display:flex;justify-content:space-between;font-size:12.5px;border-top:1px dashed var(--line);padding-top:9px}
.money b{display:block;font-size:13.5px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl-m{font-weight:700;color:var(--g700);margin:14px 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.5px}
.tl-m:first-child{margin-top:0}
.tl-i{position:relative;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.tl-i:before{content:"";position:absolute;left:-20px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--g600);box-shadow:0 0 0 3px #fff}
.tl-i.Rencana:before{background:var(--gold)}
/* absensi */
.att{display:flex;flex-direction:column;max-height:470px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.att-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.att-row:last-child{border-bottom:0}
.att-row .namecell{flex:1;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;width:34px;height:30px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.H.on{background:var(--g600);color:#fff}.seg button.I.on{background:var(--gold);color:#fff}.seg button.A.on{background:var(--red);color:#fff}
.att-sum{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.dots{display:flex;gap:4px}
.dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700}
.dot.y{background:var(--g100);color:var(--g700)}.dot.n{background:var(--red100);color:var(--red)}
/* backup */
.act-card{display:flex;flex-direction:column;gap:10px}
.act-card .kt{width:44px;height:44px}
.note{background:var(--gold100);border:1px solid #f0dfa8;color:#6b520c;border-radius:12px;padding:12px 14px;font-size:13px;display:flex;gap:10px}
.note svg{flex:none;margin-top:1px}
.countlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.countlist div{background:var(--g50);border-radius:10px;padding:10px 12px}
.countlist b{display:block;font-size:20px}
.countlist span{color:var(--muted);font-size:12px}
/* siswa */
.idcard{border-radius:18px;padding:18px;color:#fff;background:radial-gradient(circle at 90% 0%,rgba(201,154,30,.35),transparent 45%),linear-gradient(135deg,var(--g800),var(--g950));box-shadow:0 10px 30px rgba(6,42,27,.25);position:relative;overflow:hidden;max-width:440px}
.idcard:after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--gold),#ecd27c,var(--gold))}
.idc-top{display:flex;gap:10px;align-items:center;margin-bottom:18px}
.idc-top b{display:block;letter-spacing:1.5px;font-size:13px}.idc-top small{color:#bcd8c9;font-size:11.5px}
.idc-body{display:flex;gap:14px;align-items:center}
.idc-name{font-size:18px;font-weight:800}
.idc-body div div{font-size:12.5px;color:#cfe3d8}
.idc-foot{display:flex;justify-content:space-between;margin-top:18px;font-size:12px;color:#e9d9a4;font-weight:600}
.steps{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.step{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:var(--muted);width:66px;text-align:center}
.step i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px}
.step.done i{border-color:transparent}
.step.cur i{box-shadow:0 0 0 3px var(--gold)}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:14px 0}
.dl div span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.dl div b{font-weight:600}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.mo{text-align:center;border-radius:10px;padding:8px 4px;font-size:12px;font-weight:600}
.mo.y{background:var(--g100);color:var(--g700)}.mo.n{background:var(--red100);color:var(--red)}
.mo small{display:block;font-weight:500;font-size:10.5px;opacity:.8}
/* modal */
.ov{position:fixed;inset:0;background:rgba(6,30,19,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.ov.show{display:flex}
.modal{background:#fff;border-radius:18px;width:min(580px,100%);max-height:90vh;overflow:auto;padding:20px;animation:pop .18s ease}
@keyframes pop{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;gap:14px;align-items:flex-start;margin-bottom:6px}
.mh h2{margin:0;font-size:18px}
.mh>div:nth-child(2),.mh>div:first-child:not(.av){flex:1}
.x{margin-left:auto;border:0;background:var(--gray100);width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:none}
.modal h4{margin:16px 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.fg .full{grid-column:1/-1}
.fld label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px}
.fld input,.fld select{width:100%}
.rh{display:flex;flex-direction:column;gap:8px}
.rh div{display:flex;gap:10px;align-items:center;font-size:13px}
.rh i{width:8px;height:8px;border-radius:50%;background:var(--g600);flex:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--g950);color:#fff;padding:11px 18px;border-radius:12px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
.bnav{display:none}
.empty{text-align:center;color:var(--muted);padding:28px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
/* responsive */
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,1fr)}.g2,.g3{grid-template-columns:1fr}}
@media (max-width:900px){
 .app{grid-template-columns:1fr}
 .side{display:none}
 main{padding:0 0 92px}
 .mtop{display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:40;background:var(--g900);color:#fff;padding:12px 16px}
 .mtop b{display:block;font-size:14px}.mtop small{color:#a9c9b8;font-size:11.5px}
 .top{padding:16px 16px 0}
 .top h1{font-size:20px}
 .ctl{margin-left:0;width:100%}
 .ctl .sel{flex:1;min-width:140px}
 .content{padding:0 16px}
 .g2e{grid-template-columns:1fr}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50;gap:2px;box-shadow:0 -4px 16px rgba(10,40,25,.06)}
 .bnav button{flex:1 0 70px;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:10.5px;font-weight:600;color:var(--muted);padding:7px 4px;border-radius:10px;cursor:pointer;white-space:nowrap}
 .bnav button.on{color:var(--g700);background:var(--g50)}
 .ov{align-items:flex-end;padding:0}
 .modal{border-radius:20px 20px 0 0;max-height:92vh}
 .toast{bottom:96px}
}
@media (max-width:640px){
 .kpis{gap:10px}
 .kpi{padding:13px}
 .kv{font-size:21px}
 .kt{width:32px;height:32px}
 .fg,.dl{grid-template-columns:1fr}
 .months{grid-template-columns:repeat(3,1fr)}
 .tbl.cardify thead{display:none}
 .tbl.cardify,.tbl.cardify tbody{display:block}
 .tbl.cardify tr{display:block;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:8px 12px;background:#fff}
 .tbl.cardify td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 0;text-align:right}
 .tbl.cardify td:before{content:attr(data-l);color:var(--muted);font-size:12px;font-weight:600;text-align:left}
 .tbl.cardify td.nl:before{display:none}
 .tbl.cardify td.nl{text-align:left}
 .tbl.cardify tbody tr:hover td{background:none}

 for(let k=0;k<=4;k++){const v=mx*k/4,y=Y(v);g+=`<line x1="${L}" x2="${W-Rr}" y1="${y}" y2="${y}" stroke="#e8eeea"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="#7a8a82">${k?short(v):'0'}</text>`}
 labels.forEach((l,i)=>g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="#7a8a82">${l}</text>`);
 series.forEach((s,si)=>{const pts=s.v.map((v,i)=>[X(i),Y(v)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  if(si===0)g+=`<path d="${d} L${X(labels.length-1)} ${Y(0)} L${X(0)} ${Y(0)} Z" fill="${s.c}" opacity=".09"/>`;
  g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#fff" stroke="${s.c}" stroke-width="2.2"><title>${s.n} ${labels[i]}: ${rp(s.v[i])}</title></circle>`)});
 return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Grafik">${g}</svg>`}
const tabs=(key,items)=>`<div class="tabs">${items.map(([v,l])=>`<button class="${S.tab[key]===v?'on':''}" data-a="tab" data-v="${key}:${v}">${l}</button>`).join('')}</div>`;

 if(S.tab.ren==='kalender'){const g={};PROGRAM.slice().sort((a,b)=>a.tgl.localeCompare(b.tgl)).forEach(p=>{const k=p.tgl.slice(0,7);(g[k]=g[k]||[]).push(p)});
  body=`<div class="card"><div class="card-h"><div><h3>Kalender kegiatan</h3><div class="hint">Juli 2026 – Januari 2027</div></div></div><div class="tl">${Object.entries(g).map(([k,ps])=>`<div class="tl-m">${BLNF[+k.slice(5)-1]} ${k.slice(0,4)}</div>${ps.map(p=>`<div class="tl-i ${p.status}"><div class="flex"><b>${esc(p.nama)}</b><span class="sp"></span>${pill(p.status)}</div><div class="meta" style="margin-top:4px"><span>${ic('cal',14)}${fdate(p.tgl)}</span><span>${ic('user',14)}${esc(p.pj)}</span></div></div>`).join('')}`).join('')}</div></div>`}
 if(S.tab.ren==='rab')body=`<div class="card"><div class="card-h"><div><h3>Rencana Anggaran (RAB) vs Realisasi</h3><div class="hint">Tahun program 2026/2027</div></div></div><div class="tbl-wrap"><table class="tbl cardify"><thead><tr><th>Program</th><th class="num">Anggaran</th><th class="num">Realisasi</th><th class="num">Sisa</th><th style="min-width:140px">Serapan</th></tr></thead><tbody>${PROGRAM.map(p=>{const pc=Math.round(p.realisasi/p.anggaran*100);return `<tr><td data-l="Program"><b>${esc(p.nama)}</b></td><td data-l="Anggaran" class="num">${rp(p.anggaran)}</td><td data-l="Realisasi" class="num">${rp(p.realisasi)}</td><td data-l="Sisa" class="num">${rp(p.anggaran-p.realisasi)}</td><td data-l="Serapan"><div class="flex" style="flex-wrap:nowrap"><div class="progress gold" style="flex:1;min-width:60px"><i style="width:${pc}%"></i></div><b style="font-size:12px">${pc}%</b></div></td></tr>`}).join('')}<tr class="total"><td data-l="">TOTAL</td><td data-l="Anggaran" class="num">${rp(an)}</td><td data-l="Realisasi" class="num">${rp(re)}</td><td data-l="Sisa" class="num">${rp(an-re)}</td><td data-l="Serapan">${Math.round(re/an*100)}%</td></tr></tbody></table></div></div>`;
 return `<div class="stack"><div class="kpis">${kpi('target','g','Program kerja',PROGRAM.length,'Periode 2026/2027')}${kpi('clock','b','Sedang berjalan',PROGRAM.filter(p=>p.status==='Berjalan').length,'Perlu dipantau')}${kpi('check','gold','Selesai',PROGRAM.filter(p=>p.status==='Selesai').length,'Sudah dilaporkan')}${kpi('wallet','r','Serapan anggaran',Math.round(re/an*100)+'%',rp(re)+' dari '+short(an))}</div>
 <div><div class="flex" style="justify-content:space-between">${tabs('ren',[['program','Program kerja'],['kalender','Kalender'],['rab','RAB & realisasi']])}<button class="btn" style="margin-bottom:16px" data-a="toast" data-v="Form tambah program tersedia di versi jadi">${ic('plus',16)} Program baru</button></div>${body}</div></div>`};

function absenLogTable(list){return list.length?`<div class="tbl-wrap"><table class="tbl cardify"><thead><tr><th>Tanggal</th><th>Ranting</th><th class="num">Hadir</th><th class="num">Izin</th><th class="num">Alpa</th></tr></thead><tbody>${list.map(a=>`<tr><td data-l="Tanggal">${fdate(a.tgl)}</td><td data-l="Ranting">${R(a.ranting).nama}</td><td data-l="Hadir" class="num in">${a.h}</td><td data-l="Izin" class="num">${a.i}</td><td data-l="Alpa" class="num out">${a.a}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada absensi.</div>'}
PAGES.absensi=()=>{const ids=scopeIds();if(!ids.includes(S.absen.ranting)){S.absen.ranting=ids[0];S.absen.marks={}}
 const r=R(S.absen.ranting),list=M.filter(m=>m.ranting===r.id&&m.status==='Aktif'),mk=S.absen.marks,c={H:0,I:0,A:0};list.forEach(m=>mk[m.id]&&c[mk[m.id]]++);
 const jr=RANTING.filter(x=>ids.includes(x.id));
 return `<div class="g2"><div class="card"><div class="card-h"><div><h3>Isi absensi latihan</h3><div class="hint">H = hadir · I = izin · A = alpa</div></div></div>
 <div class="toolbar" style="margin-bottom:4px">${ids.length>1?`<select data-c="abr" style="flex:1">${jr.map(x=>`<option value="${x.id}" ${x.id===r.id?'selected':''}>Ranting ${x.nama} (PAC ${P(x.pac).nama})</option>`).join('')}</select>`:`<b style="flex:1">Ranting ${r.nama}</b>`}<input type="date" value="${S.absen.tgl}" data-c="abt"></div>
 <div class="att-sum">${pill('Aktif','Hadir '+c.H)} ${pill('Rencana','Izin '+c.I)} ${pill('Belum','Alpa '+c.A)} <span class="pill p-gray">Belum diisi ${list.length-c.H-c.I-c.A}</span><span class="sp"></span><button class="btn ghost sm" data-a="absenAll">Semua hadir</button></div>
 <div class="att">${list.map(m=>`<div class="att-row"><div class="namecell"><div class="av">${ini(m.nama)}</div><div><b>${esc(m.nama)}</b><small>${TINGKAT[m.tingkat].n}</small></div></div><div class="seg">${['H','I','A'].map(v=>`<button class="${v} ${mk[m.id]===v?'on':''}" data-a="mark" data-v="${m.id}|${v}">${v}</button>`).join('')}</div></div>`).join('')}</div>
 <div class="mfoot"><button class="btn" data-a="saveAbsen">${ic('check',16)} Simpan absensi</button></div></div>
 <div class="stack"><div class="card"><div class="card-h"><div><h3>Jadwal latihan</h3><div class="hint">${scopeLabel()}</div></div></div><div class="agenda">${jr.slice(0,6).map(x=>`<div class="ag"><div class="pac-ic">${ic('clock',18)}</div><div class="ag-t"><b>${x.nama} · ${x.hari}</b><span class="hint">${x.jam} WIT · ${x.tempat}</span></div></div>`).join('')}${jr.length>6?`<div class="hint">+${jr.length-6} ranting lainnya</div>`:''}</div></div>
 <div class="card"><div class="card-h"><div><h3>Riwayat absensi</h3></div></div>${absenLogTable(ABSEN_LOG.filter(a=>ids.includes(a.ranting)).slice(0,6))}</div></div></div>`};

PAGES.sekretariat=()=>{const t=S.tab.sek;let body;
 if(t==='arsip')body=`<div class="tbl-wrap"><table class="tbl cardify"><thead><tr><th>Dokumen</th><th>Jenis</th><th>Tanggal</th><th></th></tr></thead><tbody>${SURAT.arsip.map(a=>`<tr><td data-l="Dokumen"><div class="namecell"><div class="av" style="border-radius:10px">${ic('file',16)}</div><b>${a.nama}</b></div></td><td data-l="Jenis">${pill(a.jenis,a.jenis)}</td><td data-l="Tanggal">${fdate(a.tgl)}</td><td data-l=""><button class="btn ghost sm" data-a="toast" data-v="Pratinjau dokumen tersedia di versi jadi">Lihat</button></td></tr>`).join('')}</tbody></table></div>`;
 else body=`<div class="tbl-wrap"><table class="tbl cardify"><thead><tr><th>Tanggal</th><th>Nomor surat</th><th>${t==='masuk'?'Dari':'Kepada'}</th><th>Perihal</th><th>Status</th></tr></thead><tbody>${SURAT[t].map(s=>`<tr><td data-l="Tanggal">${fdate(s.tgl)}</td><td data-l="Nomor">${s.no}</td><td data-l="${t==='masuk'?'Dari':'Kepada'}"><b>${s.pihak}</b></td><td data-l="Perihal">${s.perihal}</td><td data-l="Status">${pill(s.status)}</td></tr>`).join('')}</tbody></table></div>`;
 return `<div class="stack"><div class="kpis">${kpi('inbox','b','Surat masuk',SURAT.masuk.length,SURAT.masuk.filter(s=>s.status==='Diproses').length+' perlu ditindaklanjuti')}${kpi('send','g','Surat keluar',SURAT.keluar.length,'Nomor terakhir 021')}${kpi('file','gold','Arsip & SK',SURAT.arsip.length,'Dokumen tersimpan')}${kpi('cal','r','Rapat berikutnya','2 Nov','Rapat pleno bulanan')}</div>
 <div class="card"><div class="flex" style="justify-content:space-between">${tabs('sek',[['masuk','Surat masuk'],['keluar','Surat keluar'],['arsip','Arsip & SK']])}<button class="btn" style="margin-bottom:16px" data-a="toast" data-v="Form surat + penomoran otomatis tersedia di versi jadi">${ic('plus',16)} ${t==='arsip'?'Unggah dokumen':'Catat surat'}</button></div>${body}</div></div>`};

PAGES.backup=()=>`<div class="stack"><div class="g3">
 <div class="card act-card"><span class="kt t-g">${ic('down',22)}</span><h3>Unduh backup lengkap</h3><div class="hint">Semua data induk (struktur, anggota, keuangan, program, surat) dalam satu file .json.</div><div><button class="btn" data-a="exportJson">${ic('down',16)} Unduh backup</button></div></div>
 <div class="card act-card"><span class="kt t-gold">${ic('up',22)}</span><h3>Pulihkan data</h3><div class="hint">Kembalikan data dari file backup .json. Data saat ini akan diganti.</div><div><button class="btn gold" data-a="importJson">${ic('up',16)} Pilih file backup</button></div></div>
 <div class="card act-card"><span class="kt t-b">${ic('file',22)}</span><h3>Ekspor ke Excel</h3><div class="hint">Daftar anggota dalam format CSV, bisa dibuka di Excel / Google Sheets.</div><div><button class="btn ghost" data-a="exportCsv">${ic('down',16)} Ekspor CSV</button></div></div></div>
 <div class="card"><div class="card-h"><div><h3>Isi data saat ini</h3><div class="hint">Yang akan ikut dalam file backup</div></div></div><div class="countlist"><div><b>${PAC.length}</b><span>PAC</span></div><div><b>${RANTING.length}</b><span>Ranting</span></div><div><b>${PENGURUS.length}</b><span>Pengurus cabang</span></div><div><b>${M.length}</b><span>Anggota</span></div><div><b>${getTrx().length}</b><span>Transaksi kas</span></div><div><b>${PROGRAM.length}</b><span>Program kerja</span></div><div><b>${SURAT.masuk.length+SURAT.keluar.length}</b><span>Surat</span></div></div></div>
 <div class="g2"><div class="card"><div class="card-h"><div><h3>Riwayat backup</h3></div></div><div class="tbl-wrap"><table class="tbl cardify"><thead><tr><th>Waktu</th><th>Oleh</th><th>Jenis</th><th class="num">Ukuran</th></tr></thead><tbody>${BACKUP_LOG.map(b=>`<tr><td data-l="Waktu">${b.w}</td><td data-l="Oleh">${b.oleh}</td><td data-l="Jenis">${pill(b.jenis==='Manual'?'Aktif':'Rencana',b.jenis)}</td><td data-l="Ukuran" class="num">${b.uk}</td></tr>`).join('')}</tbody></table></div></div>
 <div class="note">${ic('info',18)}<div><b>Rencana di versi jadi:</b> data tersimpan di server (Supabase) dan otomatis dicadangkan setiap malam. Aplikasi tetap bisa dibuka saat sinyal lemah dan menyinkronkan data ketika online kembali.</div></div></div></div>`;

PAGES.saya=()=>{const m=ME,r=R(m.ranting),p=P(r.pac);
 return `<div class="g2"><div class="stack"><div class="idcard"><div class="idc-top"><div class="logo sm">${ic('shield',18)}</div><div><b>PAGAR NUSA</b><small>PC Kabupaten Jayapura</small></div></div><div class="idc-body"><div class="av xl">${ini(m.nama)}</div><div><div class="idc-name">${esc(m.nama)}</div><div>No. Anggota ${m.id}</div><div>Ranting ${r.nama} · PAC ${p.nama}</div></div></div><div class="idc-foot"><span>${TINGKAT[m.tingkat].n}</span><span>Anggota sejak ${m.masuk}</span></div></div>
 <div class="card"><div class="card-h"><div><h3>Perjalanan tingkatan</h3><div class="hint">UKT berikutnya: 20 Desember 2026</div></div></div><div class="steps">${TINGKAT.map((t,i)=>`<div class="step ${i<=m.tingkat?'done':''} ${i===m.tingkat?'cur':''}"><i style="${i<=m.tingkat?`background:${t.c};color:${t.t}`:''}">${i+1}</i>${t.n.replace('Sabuk ','')}</div>`).join('')}</div></div></div>
 <div class="stack"><div class="card"><div class="card-h"><div><h3>Data diri</h3></div></div><div class="dl"><div><span>Jenis kelamin</span><b>${m.jk==='L'?'Laki-laki':'Perempuan'}</b></div><div><span>Tahun lahir</span><b>${m.lahir}</b></div><div><span>Orang tua / wali</span><b>${m.wali}</b></div><div><span>No. HP</span><b>${m.hp}</b></div><div><span>Pelatih</span><b>${r.pelatih}</b></div><div><span>Kehadiran</span><b>${m.hadir}%</b></div></div></div>
 <div class="card"><div class="card-h"><div><h3>Pengumuman</h3></div></div><div class="agenda">${PROGRAM.filter(x=>x.tgl>=TODAY).slice(0,3).map(agendaItem).join('')}</div></div></div></div>`};
PAGES.jadwalku=()=>{const r=R(ME.ranting);return `<div class="g2"><div class="card"><div class="card-h"><div><h3>Latihan rutin</h3><div class="hint">Ranting ${r.nama}</div></div></div><div class="kv">${r.hari}</div><div class="ks" style="font-size:14px">${r.jam} WIT</div><div class="meta" style="margin-top:12px"><span>${ic('pin',15)}${r.tempat}</span><span>${ic('user',15)}Pelatih: ${r.pelatih}</span></div>
 <h4 style="margin:22px 0 8px;font-size:13px;color:var(--muted)">KEHADIRAN SAYA</h4><div class="progress" style="height:12px"><i style="width:${ME.hadir}%"></i></div><div class="ks">${ME.hadir}% kehadiran · minimal 80% untuk ikut UKT</div></div>
 <div class="card"><div class="card-h"><div><h3>Kegiatan cabang</h3></div></div><div class="agenda">${PROGRAM.filter(x=>x.tgl>=TODAY).map(agendaItem).join('')}</div></div></div>`};
PAGES.iuranku=()=>{const t=ME.iuran.filter(x=>!x).length;return `<div class="stack"><div class="kpis">${kpi('alert','r','Tunggakan',rp(t*IURAN),t+' bulan belum dibayar')}${kpi('check','g','Sudah dibayar',ME.iuran.filter(Boolean).length+' bulan','Mei – Oktober 2026')}${kpi('wallet','gold','Iuran per bulan',rp(IURAN),'Ditetapkan cabang')}</div>
 <div class="card"><div class="card-h"><div><h3>Riwayat iuran 2026</h3></div></div><div class="months">${ME.iuran.map((x,i)=>`<div class="mo ${x?'y':'n'}">${MB[i]}<small>${x?'Lunas':'Belum'}</small></div>`).join('')}</div>
 <div class="note" style="margin-top:16px">${ic('info',18)}<div>Pembayaran iuran melalui pelatih ranting <b>${R(ME.ranting).pelatih}</b> setiap latihan. Status di sini diperbarui oleh bendahara.</div></div></div></div>`};

/* ================= RENDER ================= */
const TITLE={beranda:'Beranda',struktur:'Struktur Organisasi',anggota:'Data Anggota',keuangan:'Keuangan',rencana:'Perencanaan & Program Kerja',absensi:'Jadwal & Absensi',sekretariat:'Sekretariat',backup:'Backup & Pemulihan Data',saya:'Kartu & Profil Saya',jadwalku:'Jadwal Latihan',iuranku:'Iuran Saya'};
function scopeOptions(){const cur=S.scope.type==='pc'?'pc':S.scope.type+':'+S.scope.id;let o=`<option value="pc" ${cur==='pc'?'selected':''}>Seluruh Cabang</option>`;PAC.forEach(p=>{o+=`<option value="pac:${p.id}" ${cur==='pac:'+p.id?'selected':''}>PAC ${p.nama}</option>`;RANTING.filter(r=>r.pac===p.id).forEach(r=>o+=`<option value="ranting:${r.id}" ${cur==='ranting:'+r.id?'selected':''}>   ↳ Ranting ${r.nama}</option>`)});return o}
function render(){const ro=ROLES[S.role];if(!ro.nav.includes(S.page))S.page=ro.nav[0];if(S.role==='pelatih')S.scope={type:'ranting',id:'r1'};
 const navBtns=(cls)=>ro.nav.map(id=>`<button class="${S.page===id?'on':''}" data-a="go" data-v="${id}">${ic(NAV[id][1],cls?20:18)}<span>${cls&&NAV[id][0].length>12?NAV[id][0].split(' ')[0]:NAV[id][0]}</span></button>`).join('');
 $('#nav').innerHTML=`<div class="grp">Menu ${ro.label}</div>`+navBtns();
 $('#bnav').innerHTML=navBtns(1);
 $('#sidefoot').innerHTML=`Masuk sebagai<div class="who"><div class="av">${ini(ro.nama)}</div><div><b>${esc(ro.nama)}</b>${ro.jab}</div></div>`;
 const showScope=S.role==='admin'||S.role==='bendahara';
 $('#top').innerHTML=`<div><h1>${TITLE[S.page]}</h1><div class="sub">${S.role==='siswa'?'Halo, '+esc(ME.nama):scopeLabel()} · Sabtu, 17 Oktober 2026</div></div><div class="ctl">${showScope&&S.page!=='struktur'&&S.page!=='backup'&&S.page!=='sekretariat'&&S.page!=='rencana'?`<div class="sel"><label>Lingkup data</label><select data-c="scope">${scopeOptions()}</select></div>`:''}<div class="sel"><label>Lihat sebagai (demo)</label><select data-c="role">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}" ${k===S.role?'selected':''}>${r.label}</option>`).join('')}</select></div></div>`;
 $('#content').innerHTML=PAGES[S.page]();}

/* ================= AKSI ================= */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}
function openModal(h){$('#modal').innerHTML=h;$('#ov').classList.add('show')}
function closeModal(){$('#ov').classList.remove('show')}
function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}
const fld=(l,inner,full)=>`<div class="fld ${full?'full':''}"><label>${l}</label>${inner}</div>`;
const ACT={
 go:v=>{S.page=v;render();window.scrollTo(0,0)},
 tab:v=>{const [k,t]=v.split(':');S.tab[k]=t;render()},
 iuf:v=>{S.iuf=v;render()},
 toast:v=>toast(v),close:()=>closeModal(),
 member:id=>{const m=M.find(x=>x.id===id),r=R(m.ranting),p=P(r.pac);
  openModal(`<div class="mh"><div class="av lg">${ini(m.nama)}</div><div><h2>${esc(m.nama)}</h2><div class="hint">${m.id} · ${m.jk==='L'?'Laki-laki':'Perempuan'} · ${2026-m.lahir} tahun</div><div class="flex" style="margin-top:6px;gap:6px">${tk(m.tingkat)} ${pill(m.status)}</div></div><button class="x" data-a="close">${ic('x')}</button></div>
  <div class="dl"><div><span>Ranting</span><b>${r.nama}</b></div><div><span>PAC</span><b>${p.nama}</b></div><div><span>Tahun masuk</span><b>${m.masuk}</b></div><div><span>No. HP</span><b>${m.hp}</b></div><div><span>Orang tua / wali</span><b>${m.wali}</b></div><div><span>Kehadiran</span><b>${m.status==='Aktif'?m.hadir+'%':'—'}</b></div></div>
  <h4>Iuran Mei – Oktober 2026</h4><div class="months">${m.iuran.map((x,i)=>`<div class="mo ${x?'y':'n'}">${MB[i]}<small>${x?'Lunas':'Belum'}</small></div>`).join('')}</div>
  <h4>Riwayat tingkatan</h4><div class="rh"><div><i></i>${m.masuk} · Terdaftar sebagai anggota (${TINGKAT[0].n})</div>${TINGKAT.slice(1,m.tingkat+1).map((t,i)=>`<div><i></i>${Math.min(2026,m.masuk+i+1)} · Lulus UKT ke ${t.n}</div>`).join('')}</div>
  <div class="mfoot"><button class="btn ghost" data-a="toast" data-v="Edit data tersedia di versi jadi">Edit data</button><button class="btn" data-a="toast" data-v="Kartu anggota siap dicetak (contoh)">${ic('card',16)} Cetak kartu</button></div>`)},
 addMember:()=>{const ids=scopeIds();openModal(`<div class="mh"><div><h2>Tambah anggota</h2><div class="hint">Nomor anggota dibuat otomatis</div></div><button class="x" data-a="close">${ic('x')}</button></div>
  <form id="fm" class="fg" onsubmit="return false">${fld('Nama lengkap','<input name="nama" placeholder="mis. Ahmad Saputra">',1)}${fld('Jenis kelamin','<select name="jk"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select>')}${fld('Tahun lahir','<input name="lahir" type="number" value="2012">')}
  ${fld('Ranting',`<select name="ranting">${RANTING.filter(r=>ids.includes(r.id)).map(r=>`<option value="${r.id}">${r.nama} (PAC ${P(r.pac).nama})</option>`).join('')}</select>`)}${fld('Tingkatan',`<select name="tingkat">${TINGKAT.map((t,i)=>`<option value="${i}">${t.n}</option>`).join('')}</select>`)}${fld('No. HP','<input name="hp" placeholder="08…">')}${fld('Orang tua / wali','<input name="wali" placeholder="Opsional">')}</form>
  <div class="mfoot"><button class="btn ghost" data-a="close">Batal</button><button class="btn" data-a="saveMember">Simpan anggota</button></div>`)},
 saveMember:()=>{const f=new FormData($('#fm')),nama=(f.get('nama')||'').trim();if(!nama)return toast('Nama wajib diisi');
  M.unshift({id:'PN-'+String(NO++).padStart(4,'0'),nama,jk:f.get('jk'),lahir:+f.get('lahir')||2012,ranting:f.get('ranting'),tingkat:+f.get('tingkat'),status:'Aktif',masuk:2026,hp:f.get('hp')||'—',wali:f.get('wali')||'—',hadir:100,iuran:[false,false,false,false,false,false]});
  closeModal();S.q='';S.fpac='';S.ftk='';S.fst='';toast('Anggota “'+nama+'” tersimpan');render()},
 lunas:id=>{const m=M.find(x=>x.id===id);m.iuran[CUR]=true;toast('Iuran Oktober '+m.nama+' lunas · kas bertambah '+rp(IURAN));render()},
 addTrx:()=>openModal(`<div class="mh"><div><h2>Catat transaksi kas</h2><div class="hint">Setoran iuran tidak perlu dicatat di sini (otomatis)</div></div><button class="x" data-a="close">${ic('x')}</button></div>
  <form id="ft" class="fg" onsubmit="return false">${fld('Jenis','<select name="jenis"><option value="keluar">Pengeluaran</option><option value="masuk">Pemasukan</option></select>')}${fld('Tanggal',`<input name="tgl" type="date" value="${TODAY}">`)}${fld('Keterangan','<input name="ket" placeholder="mis. Beli perlengkapan P3K">',1)}${fld('Kategori','<select name="kat"><option>Operasional</option><option>Kegiatan</option><option>Sekretariat</option><option>Inventaris</option><option>Donasi</option><option>Rapat</option></select>')}${fld('Nominal (Rp)','<input name="nom" type="number" placeholder="150000">')}${fld('Lingkup',`<select name="pac"><option value="">Kas Cabang</option>${PAC.map(p=>`<option value="${p.id}">PAC ${p.nama}</option>`).join('')}</select>`,1)}</form>
  <div class="mfoot"><button class="btn ghost" data-a="close">Batal</button><button class="btn" data-a="saveTrx">Simpan</button></div>`),
 saveTrx:()=>{const f=new FormData($('#ft')),n=+f.get('nom'),ket=(f.get('ket')||'').trim();if(!ket||!n)return toast('Keterangan dan nominal wajib diisi');const tgl=f.get('tgl')||TODAY;
  TRX.push(T(tgl,ket,f.get('kat'),f.get('pac'),f.get('jenis')==='masuk'?n:0,f.get('jenis')==='keluar'?n:0));closeModal();S.tab.keu='kas';toast('Transaksi tersimpan');render()},
 mark:v=>{const [id,s]=v.split('|');S.absen.marks[id]=S.absen.marks[id]===s?undefined:s;render()},
 absenAll:()=>{M.filter(m=>m.ranting===S.absen.ranting&&m.status==='Aktif').forEach(m=>S.absen.marks[m.id]='H');render()},
 saveAbsen:()=>{const list=M.filter(m=>m.ranting===S.absen.ranting&&m.status==='Aktif'),c={H:0,I:0,A:0};list.forEach(m=>S.absen.marks[m.id]&&c[S.absen.marks[m.id]]++);
  if(c.H+c.I+c.A<list.length)return toast('Masih ada '+(list.length-c.H-c.I-c.A)+' anggota belum diisi');
  ABSEN_LOG.unshift({tgl:S.absen.tgl,ranting:S.absen.ranting,h:c.H,i:c.I,a:c.A});S.absen.marks={};toast('Absensi tersimpan · '+c.H+' hadir');render()},
 exportJson:()=>{const data={aplikasi:'SIPN Pagar Nusa',versi:1,dibuat:new Date().toISOString(),organisasi:ORG,pengurus:PENGURUS,pac:PAC,ranting:RANTING,tingkatan:TINGKAT,anggota:M,transaksi:TRX,program:PROGRAM,surat:SURAT,absensi:ABSEN_LOG};
  const txt=JSON.stringify(data,null,1);download('backup-sipn-'+TODAY+'.json',txt,'application/json');BACKUP_LOG.unshift({w:new Date().toLocaleString('sv-SE').slice(0,16),oleh:ROLES[S.role].jab,jenis:'Manual',uk:Math.round(txt.length/1024)+' KB'});toast('File backup diunduh');render()},
 importJson:()=>$('#imp').click(),
 exportCsv:()=>{const rows=[['No Anggota','Nama','JK','Tahun Lahir','Ranting','PAC','Tingkatan','Status','Tahun Masuk','No HP','Wali']].concat(inScope().map(m=>[m.id,m.nama,m.jk,m.lahir,R(m.ranting).nama,P(R(m.ranting).pac).nama,TINGKAT[m.tingkat].n,m.status,m.masuk,m.hp,m.wali]));
  download('anggota-pagarnusa-'+TODAY+'.csv','﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv');toast('Daftar anggota diekspor')}
};
document.addEventListener('click',e=>{if(e.target.id==='ov')return closeModal();const el=e.target.closest('[data-a]');if(!el)return;ACT[el.dataset.a]&&ACT[el.dataset.a](el.dataset.v,el)});
document.addEventListener('input',e=>{const c=e.target.dataset.c;if(c==='q'){S.q=e.target.value;$('#alist').innerHTML=anggotaList()}});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c||c==='q')return;const v=e.target.value;
 if(c==='role'){S.role=v;S.scope={type:'pc',id:''};S.fpac='';S.page=ROLES[v].nav[0]}
 else if(c==='scope'){if(v==='pc')S.scope={type:'pc',id:''};else{const [t,id]=v.split(':');S.scope={type:t,id}}S.fpac=''}
 else if(c==='abr'){S.absen.ranting=v;S.absen.marks={}}else if(c==='abt'){S.absen.tgl=v}else S[c]=v;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
$('#imp').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.anggota))throw 0;M.splice(0,M.length,...d.anggota);if(Array.isArray(d.transaksi))TRX=d.transaksi;if(Array.isArray(d.program))PROGRAM.splice(0,PROGRAM.length,...d.program);toast('Data dipulihkan: '+M.length+' anggota');render()}catch(err){toast('File tidak valid / bukan backup SIPN')}};rd.readAsText(f);e.target.value=''});
$('#lg1').innerHTML=ic('shield',22);$('#lg2').innerHTML=ic('shield',17);
render();
</script>
</body>
